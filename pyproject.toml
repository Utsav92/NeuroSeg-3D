[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroseg3d"
version = "0.1.0"
description = "NeuroSeg-3D: research-only 3D brain tumor segmentation from multimodal MRI"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["neuroseg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "B905", "E402", "E741"]

[tool.black]
line-length = 110

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
# Relaxed on purpose: nibabel/torch stubs are loose (FileBasedImage.shape, Optional unions, dict invariance) and
# produced ~60 false positives. Name, return, assignment and call-signature errors are still checked.
disable_error_code = ["attr-defined", "arg-type", "operator", "dict-item", "index", "union-attr"]
