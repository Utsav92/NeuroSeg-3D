# CPU smoke test on SYNTHETIC blobs (exercises the real pipeline: NIfTI -> splits -> preprocess -> train -> validate).
# Results are meaningless as medical accuracy.
experiment: smoke_resunet3d
seed: 0
output_dir: outputs/smoke
synthetic: {n_cases: 10, shape: [40, 44, 36], raw_dir: outputs/smoke/raw, processed_dir: outputs/smoke/processed, splits_dir: outputs/smoke/splits}
preprocess: {clip_percentiles: [0.5, 99.5], crop_margin: 2}
data:
  dataset: synthetic
  modalities: [flair, t1, t1ce, t2]
  patch_size: [32, 32, 32]
  samples_per_epoch: 8
  augmentation: full
model: {arch: resunet3d, out_channels: 4, base_channels: 4, depth: 4, norm: instance, dropout: 0.1}
loss: {components: {dice: 0.5, ce: 0.5}}
optim: {name: adamw, lr: 0.002}
scheduler: {name: cosine}
train: {epochs: 3, device: cpu, batch_size: 2, grad_accum: 2, num_workers: 0, val_interval: 1, val_max_cases: 2, gradient_checkpointing: true, early_stopping: {enabled: true, patience: 5}, tensorboard: false}
