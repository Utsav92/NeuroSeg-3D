experiment: arch_comparison__unet3d
seed: 42
data:
  dataset: msd_brain
  modalities:
  - flair
  - t1
  - t1ce
  - t2
  patch_size:
  - 64
  - 64
  - 64
  samples_per_epoch: 200
  augmentation: full
  sampler_probs:
    brain: 0.2
    tumor: 0.5
    boundary: 0.15
    background: 0.15
model:
  arch: unet3d
  out_channels: 4
  base_channels: 16
  depth: 4
  norm: instance
  dropout: 0.0
  down_mode: maxpool
  up_mode: transpose
loss:
  components:
    dice: 0.5
    ce: 0.5
  include_background: false
  ce_class_weights: false
optim:
  name: adamw
  lr: 0.0002
  weight_decay: 1.0e-05
scheduler:
  name: cosine
  min_lr: 1.0e-06
train:
  epochs: 100
  val_interval: 2
  val_max_cases: 20
  val_overlap: 0.5
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.0001
  device: auto
  batch_size: 1
  grad_accum: 4
  grad_clip: 1.0
  num_workers: 2
  gradient_checkpointing: false
  amp: false
  sw_batch_size: 1
  tensorboard: true
